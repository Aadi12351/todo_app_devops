
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  labels:
    app: todo-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: todo-cluster-worker
      containers:
        - name: todo-app
          image: aaditya4512/todo-app:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /data/todo.db
          volumeMounts:
            - name: todo-data
              mountPath: /data
      volumes:
        - name: todo-data
          hostPath:
            path: /data/todo-app
            type: DirectoryOrCreate
